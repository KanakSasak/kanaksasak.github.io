<title id="title">Two related retrieval paths, with different evidence scopes</title><desc id="desc">The original assessment archive leads through Git hooks and a Windows bootstrap to a TRON pointer, BSC loader and HTTP modules. Separately, related historical code connects TRON and Aptos pointers to a BSC resolver, Ethereum selection signals and BSC components. Host execution was not demonstrated for either complete path.</desc>
