<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">The research notebook</title><desc id="desc">A stylized investigation window with a signal waveform, artifact notes, and lime accents against a plum and charcoal background.</desc>
