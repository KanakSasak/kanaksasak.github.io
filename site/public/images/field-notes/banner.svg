<g fill="#eeeee6" font-family="monospace"><text x="65" y="65" font-size="17">KANAKSASAK / FIELD NOTES</text><text x="1300" y="65" font-size="17">FILE 001</text><text x="85" y="280" font-size="68" letter-spacing="-3">Follow the</text><text x="85" y="360" font-size="68" letter-spacing="-3">anomaly.</text><text x="90" y="430" font-size="17" fill="#c5c3c8">OBSERVE → QUESTION → UNDERSTAND</text></g>
